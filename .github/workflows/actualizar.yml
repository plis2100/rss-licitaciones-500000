name: Actualizar adjudicaciones España

on:
  workflow_dispatch:

  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-adjudicaciones-espana
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear RSS
        run: python actualizar_rss.py

      - name: Comprobar RSS
        run: |
          test -s feed.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          raiz = ET.parse("feed.xml").getroot()
          entradas = raiz.findall("./channel/item")

          print("RSS XML correcto.")
          print(f"Entradas encontradas: {len(entradas)}")

          if entradas:
              print("Primer título:")
              print(entradas[0].findtext("title"))
          PY

      - name: Guardar RSS actualizado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml historial.json

          if git diff --cached --quiet; then
            echo "Proceso correcto: no hay adjudicaciones nuevas."
          else
            git commit -m "Actualizar adjudicaciones España con fecha"
            git push
          fi
